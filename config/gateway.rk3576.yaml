gateway:
  id: gateway-rk3576-01

runtime:
  worker_threads: 4

logging:
  level: warn

# 本地边缘规则。
#
# 当前演示：
# Modbus模拟PLC温度固定约25℃。
#
# 温度持续超过24℃ 3秒后，
# Gateway在本地自动把电机转速设置为800 rpm。
rules:
  - id: plc-overheat-demo
    enabled: true

    device_id: modbus-plc-01
    metric: temperature

    condition:
      operator: ">"
      threshold: 24.0
      duration_ms: 3000

    cooldown_ms: 30000

    actions:
      - type: device_command
        action: set_speed
        parameters:
          value: 800

# M3：工业时序滑动窗口与异常检测
anomaly_detection:
  enabled: true

  profiles:
    - id: plc_temperature
      enabled: true

      device_id: modbus-plc-01
      metric: temperature

      # 使用最近8次采样构建历史基线
      window_size: 8

      # 标准化异常分数阈值
      score_threshold: 4.0

      # 标准差下限
      scale_floor: 0.5

      # 最小绝对偏差，温度单位为℃
      min_deviation: 3.0

      # 采样间隔超过10秒则重置窗口
      max_gap_ms: 10000

# M4：RK3576 NPU多变量时序AI异常检测
#
# 当前SKAB模型只用于独立的AI演示设备，
# 不直接绑定现有modbus-plc-01。
ai_inference:
  enabled: true

  device_id: skab-valve-demo

  model_path: models/ai/skab_valve_v1/skab_hybrid.rknn

  preprocess_path: models/ai/skab_valve_v1/preprocess.json

connectors:
  # 第一阶段保留Mock，用于确认基础上行链。
  - name: simulator
    type: mock
    enabled: true

  # TCP Server先直接启用。
  - name: tcp-server
    type: tcp
    enabled: true
    port: 9000

  # RK3576原生CAN0。
  # 当前使用控制器内部loopback完成无外接收发器验证。
  - name: can-bus
    type: can
    enabled: true
    interface: can0

  # 第一阶段Modbus模拟器直接运行在RK3576本机。
  - name: plc-01
    type: modbus
    enabled: true
    host: 127.0.0.1
    port: 1502
    device_id: modbus-plc-01
    poll_interval_ms: 1000

mqtt:
  enabled: true

  # 第一阶段Broker也先运行在RK3576本机，
  # 减少网络变量。
  server_uri: tcp://127.0.0.1:1883

  client_id: gateway-rk3576-01

  topic: gateway/gateway-rk3576-01/telemetry
  command_topic: gateway/gateway-rk3576-01/command

  qos: 1

watchdog:
  # 第一轮功能验证先关闭。
  # 等其他模块全部正常以后再单独打开真实/dev/watchdog0。
  enabled: true

  device: /dev/watchdog0
  timeout_sec: 15
  feed_interval_sec: 5
  health_timeout_sec: 60