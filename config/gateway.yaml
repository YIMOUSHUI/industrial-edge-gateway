gateway:
  id: gateway-01

runtime:
  worker_threads: 4

logging:
  level: debug

connectors:
  - name: simulator
    type: mock
    enabled: true
  - name: tcp-server
    type: tcp
    enabled: true
    port: 9000
  - name: can-bus
    type: can
    enabled: true
    interface: vcan0
  - name: plc-01
    type: modbus
    enabled: true
    host: 127.0.0.1
    port: 1502
    device_id: modbus-plc-01
    poll_interval_ms: 1000

mqtt:
  enabled: true
  server_uri: tcp://127.0.0.1:1883
  client_id: gateway-01
  topic: gateway/gateway-01/telemetry
  command_topic: gateway/gateway-01/command
  qos: 1
